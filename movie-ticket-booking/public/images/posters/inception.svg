<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="incSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="60%" stop-color="#1e3e62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#ff6500" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1e3e62" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="incAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ff6500"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#incSky)"/>
  <circle cx="150" cy="180" r="100" fill="url(#sunGlow)"/>

  <!-- Inception Folded City Geometry (Top Fold) -->
  <g transform="translate(150, 90) rotate(180)" fill="#0a121e" opacity="0.8">
    <polygon points="-120,0 -120,70 -90,70 -90,40 -60,40 -60,80 -20,80 -20,50 20,50 20,85 70,85 70,30 100,30 100,60 120,60 120,0"/>
  </g>

  <!-- Inception Totem (Spinning Top) in center -->
  <g transform="translate(150, 210) scale(1.1)">
    <!-- Spindle -->
    <rect x="-2" y="-55" width="4" height="25" fill="#f1f1f1" rx="1"/>
    <!-- Top Bulge -->
    <path d="M 0,-30 C 25,-30 40,-15 45,0 C 40,8 15,35 0,50 C -15,35 -40,8 -45,0 C -40,-15 -25,-30 0,-30 Z" fill="#d4d4d8"/>
    <!-- Highlight Reflection -->
    <path d="M -8,-25 C 5,-25 15,-15 18,-2 C 12,20 4,38 0,46 C -2,38 -8,25 -10,0 C -10,-15 -10,-25 -8,-25 Z" fill="#ffffff" opacity="0.7"/>
    <!-- Shadow Base -->
    <ellipse cx="0" cy="55" rx="35" ry="7" fill="#000000" opacity="0.6"/>
  </g>

  <!-- Ground City Silhouettes -->
  <polygon points="0,370 20,330 45,330 45,350 70,300 95,300 110,360 135,320 165,320 185,355 210,290 235,290 250,340 280,310 300,350 300,450 0,450" fill="#050a12"/>

  <!-- Badges -->
  <rect x="20" y="20" width="60" height="20" rx="4" fill="#ff6500"/>
  <text x="50" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DOLBY</text>

  <rect x="235" y="20" width="45" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="257" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">4K</text>

  <!-- Title Section -->
  <rect x="0" y="360" width="300" height="90" fill="#050a12"/>
  <rect x="30" y="360" width="240" height="2" fill="url(#incAccent)"/>

  <text x="150" y="395" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="5" text-anchor="middle">INCEPTION</text>
  <text x="150" y="415" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#ff6500" letter-spacing="2" text-anchor="middle">YOUR MIND IS THE SCENE</text>
  <text x="150" y="432" font-family="'Poppins', sans-serif" font-size="10" font-weight="400" fill="#797993" text-anchor="middle">Sci-Fi / Action • 148 min • English</text>
</svg>
