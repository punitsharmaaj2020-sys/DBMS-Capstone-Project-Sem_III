<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="lawnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e6e58"/>
      <stop offset="45%" stop-color="#2c3e35"/>
      <stop offset="100%" stop-color="#141c18"/>
    </linearGradient>
    <linearGradient id="skyMansion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdd2b6"/>
      <stop offset="100%" stop-color="#799380"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#lawnGrad)"/>

  <!-- Mansion Sky -->
  <rect x="0" y="0" width="300" height="190" fill="url(#skyMansion)"/>

  <!-- Modern Architecture Glass Pavilion House -->
  <polygon points="20,190 20,90 280,90 280,190" fill="#202621"/>
  <rect x="35" y="105" width="230" height="75" fill="#f4f7f4" opacity="0.85"/>
  <!-- Window Panes -->
  <line x1="90" y1="105" x2="90" y2="180" stroke="#202621" stroke-width="3"/>
  <line x1="150" y1="105" x2="150" y2="180" stroke="#202621" stroke-width="3"/>
  <line x1="210" y1="105" x2="210" y2="180" stroke="#202621" stroke-width="3"/>

  <!-- Lawn Green -->
  <rect x="0" y="190" width="300" height="170" fill="url(#lawnGrad)"/>

  <!-- Iconic Parasite Censored Eyes Bar on Family Silhouette -->
  <!-- Father -->
  <g transform="translate(100, 220)">
    <rect x="-18" y="0" width="36" height="75" rx="10" fill="#0c120f"/>
    <circle cx="0" cy="-16" r="14" fill="#0c120f"/>
    <!-- Black Eyes Bar -->
    <rect x="-16" y="-20" width="32" height="7" fill="#ffffff"/>
  </g>

  <!-- Mother / Child with White Eyes Bar -->
  <g transform="translate(150, 235)">
    <rect x="-15" y="0" width="30" height="60" rx="8" fill="#141c18"/>
    <circle cx="0" cy="-14" r="12" fill="#141c18"/>
    <!-- Black Eyes Bar -->
    <rect x="-14" y="-18" width="28" height="6" fill="#000000"/>
  </g>

  <!-- Native Tepee in garden -->
  <polygon points="215,220 200,280 230,280" fill="#d4a373" stroke="#8d6e63" stroke-width="2"/>

  <!-- Oscars Badge -->
  <rect x="20" y="20" width="80" height="20" rx="4" fill="#d4af37"/>
  <text x="60" y="34" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">BEST PICTURE</text>

  <rect x="235" y="20" width="45" height="20" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="257" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">PALME</text>

  <!-- Title Section -->
  <rect x="0" y="360" width="300" height="90" fill="#0a100d"/>
  <line x1="30" y1="360" x2="270" y2="360" stroke="#d4af37" stroke-width="1.5"/>

  <text x="150" y="395" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">PARASITE</text>
  <text x="150" y="415" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#d4af37" letter-spacing="2" text-anchor="middle">ACT LIKE YOU OWN THE PLACE</text>
  <text x="150" y="432" font-family="'Poppins', sans-serif" font-size="10" font-weight="400" fill="#797993" text-anchor="middle">Thriller / Drama • 132 min • Korean</text>
</svg>
