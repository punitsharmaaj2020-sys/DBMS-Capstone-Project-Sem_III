<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <radialGradient id="spaceDeep" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#191924"/>
      <stop offset="50%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <radialGradient id="holeGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ff7b25" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#4a0e4e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#ff7b25"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#spaceDeep)"/>

  <!-- Starfield Dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="25" cy="40" r="1"/><circle cx="70" cy="85" r="0.8"/><circle cx="110" cy="30" r="1.2"/>
    <circle cx="220" cy="50" r="0.7"/><circle cx="270" cy="95" r="1.3"/><circle cx="280" cy="35" r="0.6"/>
    <circle cx="45" cy="180" r="0.9"/><circle cx="260" cy="190" r="1"/><circle cx="35" cy="280" r="1.1"/>
    <circle cx="275" cy="290" r="0.8"/><circle cx="85" cy="320" r="0.7"/><circle cx="215" cy="315" r="1"/>
  </g>

  <!-- Black Hole Gargantua Glow -->
  <circle cx="150" cy="180" r="110" fill="url(#holeGlow)"/>

  <!-- Accretion Disk Vertical Arc -->
  <path d="M 60,180 C 60,100 240,100 240,180" fill="none" stroke="#ffd56b" stroke-width="8" opacity="0.85"/>
  <path d="M 75,180 C 75,120 225,120 225,180" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Black Hole Event Horizon Sphere -->
  <circle cx="150" cy="180" r="42" fill="#020204"/>

  <!-- Accretion Disk Horizontal Ring (Front Cross) -->
  <ellipse cx="150" cy="180" rx="130" ry="14" fill="none" stroke="url(#orbitRing)" stroke-width="7"/>
  <ellipse cx="150" cy="180" rx="130" ry="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>

  <!-- Endurance Spacecraft Silhouette -->
  <g transform="translate(195, 115) scale(0.65) rotate(-35)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="-3" y="-18" width="6" height="6" fill="#ffffff"/>
    <rect x="-3" y="12" width="6" height="6" fill="#ffffff"/>
    <rect x="-18" y="-3" width="6" height="6" fill="#ffffff"/>
    <rect x="12" y="-3" width="6" height="6" fill="#ffffff"/>
  </g>

  <!-- Badges -->
  <rect x="20" y="20" width="60" height="20" rx="4" fill="#ff7b25"/>
  <text x="50" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">IMAX 70MM</text>

  <rect x="235" y="20" width="45" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="257" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">4K</text>

  <!-- Title Section -->
  <rect x="0" y="360" width="300" height="90" fill="#020204"/>
  <rect x="30" y="360" width="240" height="2" fill="url(#orbitRing)"/>

  <text x="150" y="395" font-family="'Poppins', sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">INTERSTELLAR</text>
  <text x="150" y="415" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#ffd56b" letter-spacing="2" text-anchor="middle">MANKIND WAS BORN ON EARTH</text>
  <text x="150" y="432" font-family="'Poppins', sans-serif" font-size="10" font-weight="400" fill="#797993" text-anchor="middle">Sci-Fi / Drama • 169 min • English</text>
</svg>
